name: Build EPANET-UI macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 180

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake libomp proj
          brew install --cask lazarus || true
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          command -v lazbuild
          lazbuild --version
          command -v fpc
          fpc -iV
          command -v cmake

      - name: Install Lazarus dependency packages from source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.lazarus/components"
          cd "$RUNNER_TEMP"

          git clone --depth 1 --branch v11.6.6 https://github.com/bgrabitmap/bgrabitmap.git BGRA
          git clone --depth 1 --branch 11.10 https://github.com/BerndGabriel/HtmlViewer.git HtmlViewer
          git clone --depth 1 https://github.com/andreaspeters/LazMapViewer.git LazMapViewer

          BGRA_LPK=$(find "$RUNNER_TEMP/BGRA" -name '*.lpk' | head -n 1)
          HTML_LPK=$(find "$RUNNER_TEMP/HtmlViewer" -name '*.lpk' | grep -Ei 'frameviewer.*\\.lpk$' | head -n 1)
          MAP_LPK=$(find "$RUNNER_TEMP/LazMapViewer" -name '*.lpk' | grep -Ei 'lazmapviewerpkg.*\\.lpk$' | head -n 1)

          test -n "$BGRA_LPK"
          test -n "$HTML_LPK"
          test -n "$MAP_LPK"

          lazbuild "$BGRA_LPK"
          lazbuild "$HTML_LPK"
          lazbuild "$MAP_LPK"

      - name: Build native libraries for macOS
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$(brew --prefix)"
          DEPS="$RUNNER_TEMP/native-deps"
          mkdir -p "$DEPS/lib" "$DEPS/src"

          # EPANET
          git clone --depth 1 https://github.com/OpenWaterAnalytics/epanet.git "$DEPS/src/epanet"
          cmake -S "$DEPS/src/epanet" -B "$DEPS/build-epanet" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "$DEPS/build-epanet" --parallel
          find "$DEPS/build-epanet" -name 'libepanet*.dylib' -exec cp -v {} "$DEPS/lib/" \;
          test -n "$(find "$DEPS/lib" -name 'libepanet*.dylib' -print -quit)"

          # EPANET MSX
          git clone --depth 1 https://github.com/USEPA/EPANETMSX.git "$DEPS/src/epanetmsx"
          cmake -S "$DEPS/src/epanetmsx" -B "$DEPS/build-msx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$PREFIX/opt/libomp/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="$PREFIX/opt/libomp/lib/libomp.dylib" \
            -DEPANET_LIB="$(find "$DEPS/lib" -name 'libepanet*.dylib' -print -quit)"
          cmake --build "$DEPS/build-msx" --parallel
          find "$DEPS/build-msx" -name 'libepanetmsx*.dylib' -exec cp -v {} "$DEPS/lib/" \;
          test -n "$(find "$DEPS/lib" -name 'libepanetmsx*.dylib' -print -quit)"

          # Shapelib
          git clone --depth 1 https://github.com/OSGeo/shapelib.git "$DEPS/src/shapelib"
          cmake -S "$DEPS/src/shapelib" -B "$DEPS/build-shapelib" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$DEPS/build-shapelib" --parallel
          find "$DEPS/build-shapelib" -name 'libshp*.dylib' -exec cp -v {} "$DEPS/lib/" \;
          test -n "$(find "$DEPS/lib" -name 'libshp*.dylib' -print -quit)"

          # PROJ
          PROJ_LIB_DIR="$(brew --prefix proj)/lib"
          find "$PROJ_LIB_DIR" -maxdepth 1 -name 'libproj*.dylib' -exec cp -v {} "$DEPS/lib/" \;
          test -n "$(find "$DEPS/lib" -name 'libproj*.dylib' -print -quit)"

          mkdir -p bin/mac
          cp -v "$DEPS/lib"/*.dylib bin/mac/
          ls -lh bin/mac

      - name: Build EPANET-UI project
        shell: bash
        run: |
          set -euxo pipefail
          test -f epanet_ui_mac.lpi
          lazbuild epanet_ui_mac.lpi
          ls -lh bin/mac || true
          find . -maxdepth 3 \( -name 'epanet-ui*' -o -name '*.dylib' \) | sort || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-build
          path: |
            bin/mac/
          if-no-files-found: error
          retention-days: 14
