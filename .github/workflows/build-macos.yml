
name: Build EPANET-UI macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/build-macos.yml"
      - "epanet_ui_mac.lpi"
      - "epanet_ui_mac.lpr"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: epanet-ui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 180

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LAZARUS_VERSION: "4.8"
      LAZARUS_ZIP: "lazarus-darwin-aarch64-4.8.zip"
      FPC_DMG: "fpc-3.2.4rc1a.intelarm64-macosx.dmg"
      PROJ_VERSION: "7.2.1"

    steps:

      # ==========================================
      # 1. DESCARGAR EL REPOSITORIO
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. VERIFICAR APPLE SILICON
      # ==========================================

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail

          sw_vers

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::El runner no es Apple Silicon."
            exit 1
          fi

          clang --version
          git --version
          xcode-select -p

      # ==========================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          # No instalar PROJ desde Homebrew.
          # Se compilará PROJ 7.2.1 desde sus fuentes.

          brew install cmake libomp pkg-config sqlite

          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "SQLITE_PREFIX=$(brew --prefix sqlite)" >> "$GITHUB_ENV"

          cmake --version
          clang --version

          SQLITE_PREFIX="$(brew --prefix sqlite)"

          test -f "$SQLITE_PREFIX/include/sqlite3.h"
          test -f "$SQLITE_PREFIX/lib/libsqlite3.dylib"
          test -x "$SQLITE_PREFIX/bin/sqlite3"

          "$SQLITE_PREFIX/bin/sqlite3" --version

      # ==========================================
      # 4. INSTALAR FREE PASCAL ARM64
      # ==========================================

      - name: Install Free Pascal ARM64
        shell: bash
        run: |
          set -euxo pipefail

          FPC_URL="https://downloads.freepascal.org/fpc/beta/3.2.4-rc1/aarch64-macosx/${FPC_DMG}"

          DMG_PATH="$RUNNER_TEMP/$FPC_DMG"
          MOUNT_POINT="$RUNNER_TEMP/fpc-mount"

          mkdir -p "$MOUNT_POINT"

          curl --fail --location --retry 4 \
            "$FPC_URL" \
            --output "$DMG_PATH"

          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_POINT" \
            "$DMG_PATH"

          FPC_PKG="$(find "$MOUNT_POINT" \
            -type f -name '*.pkg' -print -quit)"

          if [[ -z "$FPC_PKG" ]]; then
            echo "::error::No se encontró el instalador FPC."
            find "$MOUNT_POINT" -maxdepth 4 -print
            exit 1
          fi

          sudo installer -pkg "$FPC_PKG" -target /

          hdiutil detach "$MOUNT_POINT"

          FPC_BIN="$(command -v fpc || true)"

          if [[ -z "$FPC_BIN" ]]; then
            echo "::error::No se encontró FPC."
            exit 1
          fi

          PPCA64="$(find /usr/local /opt/homebrew \
            -type f -name ppca64 -perm -111 \
            -print -quit 2>/dev/null || true)"

          if [[ -z "$PPCA64" ]]; then
            echo "::error::No se encontró ppca64."
            find /usr/local/lib /usr/local/bin \
              -iname '*ppca64*' -print 2>/dev/null || true
            exit 1
          fi

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          echo "PPCA64=$PPCA64" >> "$GITHUB_ENV"

          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP

          test "$("$FPC_BIN" -iTP)" = "aarch64"

      # ==========================================
      # 5. INSTALAR LAZARUS ARM64
      # ==========================================

      - name: Install Lazarus
        shell: bash
        run: |
          set -euxo pipefail

          DOWNLOAD_URL="https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/${LAZARUS_ZIP}"

          INSTALL_DIR="$RUNNER_TEMP/lazarus-${LAZARUS_VERSION}"

          mkdir -p "$INSTALL_DIR"

          curl --fail --location --retry 4 \
            "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/$LAZARUS_ZIP"

          unzip -q "$RUNNER_TEMP/$LAZARUS_ZIP" \
            -d "$INSTALL_DIR"

          LAZBUILD_PATH="$(find "$INSTALL_DIR" \
            -type f -name lazbuild -perm -111 \
            -print -quit)"

          if [[ -z "$LAZBUILD_PATH" ]]; then
            echo "::error::No se encontró lazbuild."
            find "$INSTALL_DIR" -maxdepth 6 -print
            exit 1
          fi

          LAZARUS_DIR="$(dirname "$LAZBUILD_PATH")"

          if [[ ! -f "$LAZARUS_DIR/packager/registration/fcl.lpk" ]]; then
            echo "::error::Directorio Lazarus incorrecto."
            find "$INSTALL_DIR" \
              -path '*/packager/registration/fcl.lpk' -print
            exit 1
          fi

          echo "LAZARUS_DIR=$LAZARUS_DIR" >> "$GITHUB_ENV"
          echo "LAZBUILD_PATH=$LAZBUILD_PATH" >> "$GITHUB_ENV"

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --version

      # ==========================================
      # 6. INSTALAR PAQUETES LAZARUS
      # ==========================================

      - name: Install Lazarus packages
        shell: bash
        run: |
          set -euxo pipefail

          COMPONENTS="$RUNNER_TEMP/lazarus-components"
          LAZARUS_CONFIG="$HOME/.lazarus"

          mkdir -p "$COMPONENTS" "$LAZARUS_CONFIG"

          git clone --depth 1 --branch v11.6.6 \
            https://github.com/bgrabitmap/bgrabitmap.git \
            "$COMPONENTS/BGRA"

          git clone --depth 1 --branch 11.10 \
            https://github.com/BerndGabriel/HtmlViewer.git \
            "$COMPONENTS/HtmlViewer"

          git clone --depth 1 \
            https://github.com/andreaspeters/LazMapViewer.git \
            "$COMPONENTS/LazMapViewer"

          BGRA_BITMAP_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bgrabitmappack.lpk' -print -quit)"

          BGRA_CONTROLS_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bglcontrols.lpk' -print -quit)"

          HTML_LPK="$(find "$COMPONENTS/HtmlViewer" \
            -iname '*frameviewer*.lpk' -print -quit)"

          MAP_LPK="$(find "$COMPONENTS/LazMapViewer" \
            -iname '*lazmapviewerpkg*.lpk' -print -quit)"

          for PACKAGE in \
            "$BGRA_BITMAP_LPK" \
            "$BGRA_CONTROLS_LPK" \
            "$HTML_LPK" \
            "$MAP_LPK"; do

            if [[ -z "$PACKAGE" || ! -f "$PACKAGE" ]]; then
              echo "::error::No se encontró un paquete Lazarus."
              find "$COMPONENTS" -name '*.lpk' -print
              exit 1
            fi
          done

          LAZBUILD_ARGS=(
            "--lazarusdir=$LAZARUS_DIR"
            "--pcp=$LAZARUS_CONFIG"
            "--compiler=$FPC_BIN"
          )

          echo "Compilando BGRABitmapPack"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$BGRA_BITMAP_LPK"

          echo "Compilando BGControls"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$BGRA_CONTROLS_LPK"

          echo "Compilando HtmlViewer"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$HTML_LPK"

          echo "Compilando LazMapViewer"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$MAP_LPK"

      # ==========================================
      # 7. CREAR DIRECTORIOS
      # ==========================================

      - name: Prepare native build directories
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          mkdir -p \
            "$DEPS/src" \
            "$DEPS/lib" \
            "$DEPS/build-epanet" \
            "$DEPS/build-msx" \
            "$DEPS/build-shapelib" \
            "$DEPS/build-proj" \
            bin/mac

      # ==========================================
      # 8. COMPILAR EPANET
      # ==========================================

      - name: Build EPANET
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OpenWaterAnalytics/EPANET.git \
            "$DEPS/src/epanet"

          cmake \
            -S "$DEPS/src/epanet" \
            -B "$DEPS/build-epanet" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF

          cmake --build "$DEPS/build-epanet" \
            --config Release \
            --parallel

          find "$DEPS/build-epanet" \
            -type f -name 'libepanet*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;

          EPANET_DYLIB="$(find "$DEPS/lib" \
            -name 'libepanet*.dylib' -print -quit)"

          if [[ -z "$EPANET_DYLIB" ]]; then
            echo "::error::No se generó libepanet."
            find "$DEPS/build-epanet" -type f -print
            exit 1
          fi

          file "$EPANET_DYLIB"
          lipo -archs "$EPANET_DYLIB" | grep -q arm64

      # ==========================================
      # 9. DESCARGAR EPANET-MSX Y SUBMODULOS
      # ==========================================

      - name: Download EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"
          MSX_SOURCE="$DEPS/src/epanetmsx"

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/USEPA/EPANETMSX.git \
            "$MSX_SOURCE"

          cd "$MSX_SOURCE"

          git submodule status

          if [[ ! -d "EPANET2.2/SRC_engines" ]]; then
            echo "::error::No existe EPANET2.2/SRC_engines."
            git submodule status
            find . -maxdepth 4 -type d -print
            exit 1
          fi

          if [[ ! -f "EPANET2.2/SRC_engines/CMakeLists.txt" ]]; then
            echo "::error::Falta CMakeLists.txt de SRC_engines."
            exit 1
          fi

          echo "Submodulo EPANET2.2 verificado."

      # ==========================================
      # 10. COMPILAR EPANET-MSX
      # ==========================================

      - name: Build EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cmake \
            -S "$DEPS/src/epanetmsx" \
            -B "$DEPS/build-msx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib"

          cmake --build "$DEPS/build-msx" \
            --config Release \
            --parallel

          MSX_DYLIB="$(find "$DEPS/build-msx" \
            -type f -name 'libepanetmsx*.dylib' \
            -print -quit)"

          if [[ -z "$MSX_DYLIB" ]]; then
            echo "::error::No se generó libepanetmsx.dylib."
            find "$DEPS/build-msx" -type f -print
            exit 1
          fi

          cp -v "$MSX_DYLIB" "$DEPS/lib/"

          file "$DEPS/lib/$(basename "$MSX_DYLIB")"
          lipo -archs "$DEPS/lib/$(basename "$MSX_DYLIB")" \
            | grep -q arm64

      # ==========================================
      # 11. COMPILAR SHAPELIB
      # ==========================================

      - name: Build ShapeLib
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OSGeo/shapelib.git \
            "$DEPS/src/shapelib"

          cmake \
            -S "$DEPS/src/shapelib" \
            -B "$DEPS/build-shapelib" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON

          cmake --build "$DEPS/build-shapelib" \
            --config Release \
            --parallel

          SHP_DYLIB="$(find "$DEPS/build-shapelib" \
            -type f -name 'libshp*.dylib' \
            -print -quit)"

          if [[ -z "$SHP_DYLIB" ]]; then
            echo "::error::No se generó libshp.dylib."
            find "$DEPS/build-shapelib" -type f -print
            exit 1
          fi

          cp -v "$SHP_DYLIB" "$DEPS/lib/"

          file "$DEPS/lib/$(basename "$SHP_DYLIB")"
          lipo -archs "$DEPS/lib/$(basename "$SHP_DYLIB")" \
            | grep -q arm64

      # ==========================================
      # 12. COMPILAR PROJ 7.2.1
      # ==========================================

      - name: Build PROJ 7.2.1 ARM64
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          PROJ_SOURCE="$DEPS/src/proj-$PROJ_VERSION"
          PROJ_BUILD="$DEPS/build-proj"
          PROJ_INSTALL="$DEPS/proj-install"

          SQLITE_PREFIX="$SQLITE_PREFIX"

          echo "======================================"
          echo "DESCARGANDO PROJ $PROJ_VERSION"
          echo "======================================"

          curl --fail --location --retry 4 \
            "https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz"

          tar -xzf "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz" \
            -C "$DEPS/src"

          test -f "$PROJ_SOURCE/CMakeLists.txt"

          echo "======================================"
          echo "CONFIGURANDO PROJ ARM64"
          echo "======================================"

          cmake \
            -S "$PROJ_SOURCE" \
            -B "$PROJ_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$PROJ_INSTALL" \
            -DCMAKE_PREFIX_PATH="$SQLITE_PREFIX" \
            -DSQLITE3_INCLUDE_DIR="$SQLITE_PREFIX/include" \
            -DSQLITE3_LIBRARY="$SQLITE_PREFIX/lib/libsqlite3.dylib" \
            -DENABLE_TIFF=OFF \
            -DENABLE_CURL=OFF \
            -DBUILD_PROJSYNC=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=ON

          echo "======================================"
          echo "COMPILANDO PROJ"
          echo "======================================"

          cmake --build "$PROJ_BUILD" \
            --config Release \
            --parallel

          echo "======================================"
          echo "INSTALANDO PROJ"
          echo "======================================"

          cmake --install "$PROJ_BUILD" \
            --config Release

          echo "======================================"
          echo "LOCALIZANDO LIBPROJ"
          echo "======================================"

          PROJ_DYLIB="$(find "$PROJ_INSTALL/lib" \
            -name 'libproj*.dylib' \
            -type f -print -quit)"

          if [[ -z "$PROJ_DYLIB" ]]; then
            echo "::error::No se generó la biblioteca PROJ."
            find "$PROJ_INSTALL" -type f -print
            exit 1
          fi

          echo "Biblioteca encontrada: $PROJ_DYLIB"

          echo "======================================"
          echo "VERIFICANDO API ANTIGUA"
          echo "======================================"

          nm -gU "$PROJ_DYLIB" > "$RUNNER_TEMP/proj-symbols.txt"

          cat "$RUNNER_TEMP/proj-symbols.txt" \
            | grep -E '_pj_(init_plus|transform|is_latlong|free)$'

          for SYMBOL in \
            _pj_init_plus \
            _pj_transform \
            _pj_is_latlong \
            _pj_free; do

            if ! grep -q "$SYMBOL" "$RUNNER_TEMP/proj-symbols.txt"; then
              echo "::error::PROJ no exporta el símbolo $SYMBOL."
              exit 1
            fi
          done

          echo "======================================"
          echo "VERIFICANDO ARQUITECTURA"
          echo "======================================"

          file "$PROJ_DYLIB"

          lipo -archs "$PROJ_DYLIB" | grep -q arm64

          cp -L "$PROJ_DYLIB" "$DEPS/lib/libproj.dylib"

          echo "PROJ_INSTALL=$PROJ_INSTALL" >> "$GITHUB_ENV"

          echo "PROJ 7.2.1 compilado y verificado."

      # ==========================================
      # 13. PREPARAR BIBLIOTECAS
      # ==========================================

      - name: Prepare native libraries
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cp -Lv "$LIBOMP_PREFIX/lib/libomp.dylib" \
            "$DEPS/lib/libomp.dylib"

          mkdir -p bin/mac

          cp -Lv "$DEPS/lib/"*.dylib bin/mac/

          echo "======================================"
          echo "BIBLIOTECAS DISPONIBLES"
          echo "======================================"

          ls -lah bin/mac

          echo "======================================"
          echo "VERIFICAR ARM64"
          echo "======================================"

          for LIBRARY in bin/mac/*.dylib; do

            echo "Verificando $LIBRARY"

            file "$LIBRARY"

            lipo -archs "$LIBRARY" | grep -q arm64 || {
              echo "::error::Biblioteca incompatible con ARM64: $LIBRARY"
              exit 1
            }
          done

          echo "======================================"
          echo "VERIFICAR SIMBOLOS PROJ"
          echo "======================================"

          nm -gU bin/mac/libproj.dylib \
            | grep -E '_pj_(init_plus|transform|is_latlong|free)$'

      # ==========================================
      # 14. COMPILAR EPANET-UI
      # ==========================================

      - name: Build EPANET-UI project
        shell: bash
        run: |
          set -euxo pipefail

          test -f epanet_ui_mac.lpi
          test -f epanet_ui_mac.lpr

          echo "======================================"
          echo "COMPILANDO EPANET-UI"
          echo "======================================"

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --pcp="$HOME/.lazarus" \
            --compiler="$FPC_BIN" \
            --build-all \
            --ws=cocoa \
            epanet_ui_mac.lpi

          echo "======================================"
          echo "RESULTADOS"
          echo "======================================"

          find . -maxdepth 8 \
            \( -name '*.app' -o \
               -name 'epanet-ui*' -o \
               -name '*.dylib' \) \
            -print | sort

      # ==========================================
      # 15. VERIFICAR APLICACION
      # ==========================================

      - name: Verify application
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find bin/mac -type d \
            -name '*.app' -print -quit)"

          if [[ -z "$APP" ]]; then
            echo "::error::No se encontró el bundle .app."
            find bin/mac -maxdepth 6 -print
            exit 1
          fi

          INFO_PLIST="$APP/Contents/Info.plist"

          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Falta Info.plist."
            exit 1
          fi

          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$INFO_PLIST")"

          EXECUTABLE="$APP/Contents/MacOS/$APP_EXECUTABLE"

          if [[ ! -f "$EXECUTABLE" ]]; then
            echo "::error::No existe el ejecutable principal."
            find "$APP" -maxdepth 5 -print
            exit 1
          fi

          file "$EXECUTABLE"

          lipo -archs "$EXECUTABLE" | grep -q arm64

          echo "=== Dependencias del ejecutable ==="

          otool -L "$EXECUTABLE"

          echo "=== Bundle generado ==="

          find "$APP" -maxdepth 5 -print

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # ==========================================
      # 16. EMPAQUETAR APLICACION
      # ==========================================

      - name: Package macOS application
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip"

          shasum -a 256 \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip" \
            > "dist/SHA256SUMS.txt"

          ls -lah dist

      # ==========================================
      # 17. SUBIR DIAGNOSTICOS
      # ==========================================

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64-diagnostics
          path: |
            ${{ runner.temp }}/native-deps/
            ${{ runner.temp }}/lazarus-components/
            ${{ runner.temp }}/proj-symbols.txt
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # 18. SUBIR APLICACION FINAL
      # ==========================================

      - name: Upload macOS application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64
          path: |
            dist/EPANET-UI-macOS-Apple-Silicon.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
