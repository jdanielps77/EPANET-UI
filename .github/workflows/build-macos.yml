
name: Build EPANET-UI macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/build-macos.yml"
      - "epanet_ui_mac.lpi"
      - "epanet_ui_mac.lpr"

permissions:
  contents: read

concurrency:
  group: epanet-ui-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LAZARUS_VERSION: "4.8"
      LAZARUS_ZIP: "lazarus-darwin-aarch64-4.8.zip"
      FPC_DMG: "fpc-3.2.4rc1a.intelarm64-macosx.dmg"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = "arm64" || {
            echo "::error::El runner no es Apple Silicon."
            exit 1
          }
          xcode-select -p
          clang --version
          git --version

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install cmake libomp proj pkg-config
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "PROJ_PREFIX=$(brew --prefix proj)" >> "$GITHUB_ENV"
          cmake --version
          pkg-config --version

      - name: Install official Free Pascal ARM64
        shell: bash
        run: |
          set -euxo pipefail
          FPC_URL="https://downloads.freepascal.org/fpc/beta/3.2.4-rc1/aarch64-macosx/${FPC_DMG}"
          DMG_PATH="$RUNNER_TEMP/$FPC_DMG"
          MOUNT_POINT="$RUNNER_TEMP/fpc-mount"
          mkdir -p "$MOUNT_POINT"

          curl --fail --location --retry 4 "$FPC_URL" --output "$DMG_PATH"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG_PATH"

          FPC_PKG="$(find "$MOUNT_POINT" -type f -name '*.pkg' -print -quit)"
          if [[ -z "$FPC_PKG" ]]; then
            echo "::error::No se encontró el instalador PKG de FPC."
            find "$MOUNT_POINT" -maxdepth 4 -print
            exit 1
          fi

          sudo installer -pkg "$FPC_PKG" -target /
          hdiutil detach "$MOUNT_POINT"

          FPC_BIN="$(command -v fpc || true)"
          if [[ -z "$FPC_BIN" ]]; then
            echo "::error::No se encontró fpc después de instalarlo."
            find /usr/local /opt/homebrew -type f -name fpc -print 2>/dev/null || true
            exit 1
          fi

          PPCA64="$(find /usr/local /opt/homebrew -type f -name ppca64 -perm -111 -print -quit 2>/dev/null || true)"
          if [[ -z "$PPCA64" ]]; then
            echo "::error::No se encontró el backend ppca64."
            find /usr/local/lib /usr/local/bin -iname '*ppca64*' -print 2>/dev/null || true
            exit 1
          fi

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          echo "PPCA64=$PPCA64" >> "$GITHUB_ENV"
          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP
          file "$FPC_BIN"
          test "$("$FPC_BIN" -iTP)" = "aarch64"

      - name: Install official Lazarus for Apple Silicon
        shell: bash
        run: |
          set -euxo pipefail
          DOWNLOAD_URL="https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/${LAZARUS_ZIP}"
          INSTALL_DIR="$RUNNER_TEMP/lazarus-${LAZARUS_VERSION}"
          mkdir -p "$INSTALL_DIR"

          curl --fail --location --retry 4 "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/$LAZARUS_ZIP"
          xattr -c "$RUNNER_TEMP/$LAZARUS_ZIP" || true
          unzip -q "$RUNNER_TEMP/$LAZARUS_ZIP" -d "$INSTALL_DIR"

          LAZBUILD_PATH="$(find "$INSTALL_DIR" -type f -name lazbuild -perm -111 -print -quit)"
          if [[ -z "$LAZBUILD_PATH" ]]; then
            echo "::error::No se encontró lazbuild."
            find "$INSTALL_DIR" -maxdepth 6 -print
            exit 1
          fi

          LAZARUS_DIR="$(dirname "$LAZBUILD_PATH")"
          if [[ ! -f "$LAZARUS_DIR/packager/registration/fcl.lpk" ]]; then
            echo "::error::La ruta detectada no es la raíz válida de Lazarus: $LAZARUS_DIR"
            find "$INSTALL_DIR" -path '*/packager/registration/fcl.lpk' -print
            exit 1
          fi

          echo "LAZARUS_DIR=$LAZARUS_DIR" >> "$GITHUB_ENV"
          echo "LAZBUILD_PATH=$LAZBUILD_PATH" >> "$GITHUB_ENV"
          "$LAZBUILD_PATH" --lazarusdir="$LAZARUS_DIR" --version
          "$FPC_BIN" -iV
          "$PPCA64" -iV

      - name: Install Lazarus dependency packages
        shell: bash
        run: |
          set -euxo pipefail
          COMPONENTS="$RUNNER_TEMP/lazarus-components"
          LAZARUS_CONFIG="$HOME/.lazarus"
          mkdir -p "$COMPONENTS" "$LAZARUS_CONFIG"

          git clone --depth 1 --branch v11.6.6 \
            https://github.com/bgrabitmap/bgrabitmap.git "$COMPONENTS/BGRA"
          git clone --depth 1 --branch 11.10 \
            https://github.com/BerndGabriel/HtmlViewer.git "$COMPONENTS/HtmlViewer"
          git clone --depth 1 \
            https://github.com/andreaspeters/LazMapViewer.git "$COMPONENTS/LazMapViewer"

          BGRA_BITMAP_LPK="$(find "$COMPONENTS/BGRA" -iname 'bgrabitmappack.lpk' -print -quit)"
          BGRA_CONTROLS_LPK="$(find "$COMPONENTS/BGRA" -iname 'bglcontrols.lpk' -print -quit)"
          HTML_LPK="$(find "$COMPONENTS/HtmlViewer" -iname '*frameviewer*.lpk' -print -quit)"
          MAP_LPK="$(find "$COMPONENTS/LazMapViewer" -iname '*lazmapviewerpkg*.lpk' -print -quit)"

          for PACKAGE in "$BGRA_BITMAP_LPK" "$BGRA_CONTROLS_LPK" "$HTML_LPK" "$MAP_LPK"; do
            if [[ -z "$PACKAGE" || ! -f "$PACKAGE" ]]; then
              echo "::error::No se encontró un paquete Lazarus requerido."
              find "$COMPONENTS" -name '*.lpk' -print
              exit 1
            fi
          done

          LAZBUILD_ARGS=(
            "--lazarusdir=$LAZARUS_DIR"
            "--pcp=$LAZARUS_CONFIG"
            "--compiler=$FPC_BIN"
          )

          echo "=== Compilar BGRABitmapPack primero ==="
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$BGRA_BITMAP_LPK"

          echo "=== Compilar BGControls después ==="
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$BGRA_CONTROLS_LPK"

          echo "=== Compilar HtmlViewer ==="
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$HTML_LPK"

          echo "=== Compilar LazMapViewer ==="
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$MAP_LPK"

      - name: Build native libraries for macOS ARM64
        shell: bash
        run: |
          set -euxo pipefail
          DEPS="$RUNNER_TEMP/native-deps"
          mkdir -p "$DEPS/src" "$DEPS/lib" bin/mac

          git clone --depth 1 https://github.com/OpenWaterAnalytics/EPANET.git "$DEPS/src/epanet"
          cmake -S "$DEPS/src/epanet" -B "$DEPS/build-epanet" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF
          cmake --build "$DEPS/build-epanet" --config Release --parallel

          find "$DEPS/build-epanet" -type f -name 'libepanet*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;
          EPANET_DYLIB="$(find "$DEPS/lib" -name 'libepanet*.dylib' -print -quit)"
          test -n "$EPANET_DYLIB" || {
            echo "::error::No se generó libepanet*.dylib."
            find "$DEPS/build-epanet" -type f -print
            exit 1
          }

          git clone --depth 1 https://github.com/USEPA/EPANETMSX.git "$DEPS/src/epanetmsx"
          cmake -S "$DEPS/src/epanetmsx" -B "$DEPS/build-msx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib" \
            -DEPANET_LIB="$EPANET_DYLIB"
          cmake --build "$DEPS/build-msx" --config Release --parallel

          find "$DEPS/build-msx" -type f -name 'libepanetmsx*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;
          MSX_DYLIB="$(find "$DEPS/lib" -name 'libepanetmsx*.dylib' -print -quit)"
          test -n "$MSX_DYLIB" || {
            echo "::error::No se generó libepanetmsx*.dylib."
            find "$DEPS/build-msx" -type f -print
            exit 1
          }

          git clone --depth 1 https://github.com/OSGeo/shapelib.git "$DEPS/src/shapelib"
          cmake -S "$DEPS/src/shapelib" -B "$DEPS/build-shapelib" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "$DEPS/build-shapelib" --config Release --parallel

          find "$DEPS/build-shapelib" -type f -name 'libshp*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;
          SHP_DYLIB="$(find "$DEPS/lib" -name 'libshp*.dylib' -print -quit)"
          test -n "$SHP_DYLIB" || {
            echo "::error::No se generó libshp*.dylib."
            find "$DEPS/build-shapelib" -type f -print
            exit 1
          }

          find "$PROJ_PREFIX/lib" -maxdepth 1 -type f -name 'libproj*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;
          test -n "$(find "$DEPS/lib" -name 'libproj*.dylib' -print -quit)"

          cp -v "${LIBOMP_PREFIX}/lib/libomp.dylib" "$DEPS/lib/"
          cp -v "$DEPS/lib/"*.dylib bin/mac/

          echo "=== Verificar arquitectura de las bibliotecas ==="
          for LIBRARY in bin/mac/*.dylib; do
            file "$LIBRARY"
            lipo -archs "$LIBRARY" | grep -q arm64 || {
              echo "::error::Biblioteca no ARM64: $LIBRARY"
              exit 1
            }
          done

      - name: Build EPANET-UI project
        shell: bash
        run: |
          set -euxo pipefail
          test -f epanet_ui_mac.lpi
          test -f epanet_ui_mac.lpr

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --pcp="$HOME/.lazarus" \
            --compiler="$FPC_BIN" \
            --build-all \
            --ws=cocoa \
            epanet_ui_mac.lpi

          find . -maxdepth 7 \
            \( -name '*.app' -o -name 'epanet-ui*' -o -name '*.dylib' \) \
            -print | sort

      - name: Verify application and dynamic libraries
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find . -type d -name '*.app' -not -path './.git/*' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "::error::La compilación no produjo un bundle .app."
            find . -maxdepth 8 -type f -perm -111 -print
            exit 1
          fi

          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          EXECUTABLE="$APP/Contents/MacOS/$APP_EXECUTABLE"

          test -f "$EXECUTABLE" || {
            echo "::error::No existe el ejecutable principal: $EXECUTABLE"
            exit 1
          }

          file "$EXECUTABLE"
          lipo -archs "$EXECUTABLE" | grep -q arm64
          otool -L "$EXECUTABLE"
          find "$APP" -maxdepth 5 -print

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package macOS application
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "dist/EPANET-UI-macOS-Apple-Silicon.zip"
          shasum -a 256 "dist/EPANET-UI-macOS-Apple-Silicon.zip" \
            > "dist/SHA256SUMS.txt"
          ls -lah dist

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64-diagnostics
          path: |
            ${{ runner.temp }}/lazarus-components/
            ${{ runner.temp }}/native-deps/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload macOS application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64
          path: |
            dist/EPANET-UI-macOS-Apple-Silicon.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
