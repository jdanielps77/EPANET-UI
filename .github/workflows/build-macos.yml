
name: Build EPANET-UI macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/build-macos.yml"
      - "epanet_ui_mac.lpi"
      - "epanet_ui_mac.lpr"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: epanet-ui-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 240

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LAZARUS_VERSION: "4.8"
      LAZARUS_ZIP: "lazarus-darwin-aarch64-4.8.zip"
      FPC_DMG: "fpc-3.2.4rc1a.intelarm64-macosx.dmg"
      PROJ_VERSION: "7.2.1"

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. VERIFICAR RUNNER APPLE SILICON
      # ==========================================

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail

          sw_vers

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::El runner no es Apple Silicon."
            exit 1
          fi

          xcode-select -p
          clang --version
          git --version

      # ==========================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew install cmake libomp pkg-config sqlite

          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "SQLITE_PREFIX=$(brew --prefix sqlite)" >> "$GITHUB_ENV"

          cmake --version
          pkg-config --version
          sqlite3 --version

          sqlite3 :memory: "SELECT sqlite_version();"

          test -f "$(brew --prefix sqlite)/include/sqlite3.h"

      # ==========================================
      # 4. INSTALAR FREE PASCAL
      # ==========================================

      - name: Install Free Pascal ARM64
        shell: bash
        run: |
          set -euxo pipefail

          FPC_URL="https://downloads.freepascal.org/fpc/beta/3.2.4-rc1/aarch64-macosx/${FPC_DMG}"

          DMG_PATH="$RUNNER_TEMP/$FPC_DMG"
          MOUNT_POINT="$RUNNER_TEMP/fpc-mount"

          mkdir -p "$MOUNT_POINT"

          curl --fail --location --retry 4 \
            "$FPC_URL" \
            --output "$DMG_PATH"

          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_POINT" \
            "$DMG_PATH"

          FPC_PKG="$(find "$MOUNT_POINT" \
            -type f -name '*.pkg' -print -quit)"

          if [[ -z "$FPC_PKG" ]]; then
            echo "::error::No se encontró el instalador FPC."
            find "$MOUNT_POINT" -maxdepth 4 -print
            exit 1
          fi

          sudo installer -pkg "$FPC_PKG" -target /

          hdiutil detach "$MOUNT_POINT"

          FPC_BIN="$(command -v fpc || true)"

          if [[ -z "$FPC_BIN" ]]; then
            echo "::error::No se encontró FPC."
            exit 1
          fi

          PPCA64="$(find /usr/local /opt/homebrew \
            -type f -name ppca64 -perm -111 \
            -print -quit 2>/dev/null || true)"

          if [[ -z "$PPCA64" ]]; then
            echo "::error::No se encontró ppca64."
            exit 1
          fi

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          echo "PPCA64=$PPCA64" >> "$GITHUB_ENV"

          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP

          test "$("$FPC_BIN" -iTP)" = "aarch64"

      # ==========================================
      # 5. INSTALAR LAZARUS
      # ==========================================

      - name: Install Lazarus ARM64
        shell: bash
        run: |
          set -euxo pipefail

          DOWNLOAD_URL="https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/${LAZARUS_ZIP}"

          INSTALL_DIR="$RUNNER_TEMP/lazarus-${LAZARUS_VERSION}"

          mkdir -p "$INSTALL_DIR"

          curl --fail --location --retry 4 \
            "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/$LAZARUS_ZIP"

          xattr -c "$RUNNER_TEMP/$LAZARUS_ZIP" || true

          unzip -q "$RUNNER_TEMP/$LAZARUS_ZIP" \
            -d "$INSTALL_DIR"

          LAZBUILD_PATH="$(find "$INSTALL_DIR" \
            -type f -name lazbuild -perm -111 \
            -print -quit)"

          if [[ -z "$LAZBUILD_PATH" ]]; then
            echo "::error::No se encontró lazbuild."
            find "$INSTALL_DIR" -maxdepth 6 -print
            exit 1
          fi

          LAZARUS_DIR="$(dirname "$LAZBUILD_PATH")"

          if [[ ! -f "$LAZARUS_DIR/packager/registration/fcl.lpk" ]]; then
            echo "::error::Directorio Lazarus incorrecto."
            exit 1
          fi

          echo "LAZARUS_DIR=$LAZARUS_DIR" >> "$GITHUB_ENV"
          echo "LAZBUILD_PATH=$LAZBUILD_PATH" >> "$GITHUB_ENV"

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --version

      # ==========================================
      # 6. INSTALAR COMPONENTES LAZARUS
      # ==========================================

      - name: Install Lazarus packages
        shell: bash
        run: |
          set -euxo pipefail

          COMPONENTS="$RUNNER_TEMP/lazarus-components"
          LAZARUS_CONFIG="$HOME/.lazarus"

          mkdir -p "$COMPONENTS" "$LAZARUS_CONFIG"

          git clone --depth 1 --branch v11.6.6 \
            https://github.com/bgrabitmap/bgrabitmap.git \
            "$COMPONENTS/BGRA"

          git clone --depth 1 --branch 11.10 \
            https://github.com/BerndGabriel/HtmlViewer.git \
            "$COMPONENTS/HtmlViewer"

          git clone --depth 1 \
            https://github.com/andreaspeters/LazMapViewer.git \
            "$COMPONENTS/LazMapViewer"

          BGRA_BITMAP_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bgrabitmappack.lpk' -print -quit)"

          BGRA_CONTROLS_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bglcontrols.lpk' -print -quit)"

          HTML_LPK="$(find "$COMPONENTS/HtmlViewer" \
            -iname '*frameviewer*.lpk' -print -quit)"

          MAP_LPK="$(find "$COMPONENTS/LazMapViewer" \
            -iname '*lazmapviewerpkg*.lpk' -print -quit)"

          for PACKAGE in \
            "$BGRA_BITMAP_LPK" \
            "$BGRA_CONTROLS_LPK" \
            "$HTML_LPK" \
            "$MAP_LPK"; do

            if [[ -z "$PACKAGE" || ! -f "$PACKAGE" ]]; then
              echo "::error::No se encontró un paquete Lazarus."
              find "$COMPONENTS" -name '*.lpk' -print
              exit 1
            fi
          done

          LAZBUILD_ARGS=(
            "--lazarusdir=$LAZARUS_DIR"
            "--pcp=$LAZARUS_CONFIG"
            "--compiler=$FPC_BIN"
          )

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$BGRA_BITMAP_LPK"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$BGRA_CONTROLS_LPK"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$HTML_LPK"

          "$LAZBUILD_PATH" \
            "${LAZBUILD_ARGS[@]}" \
            "$MAP_LPK"

      # ==========================================
      # 7. PREPARAR DIRECTORIOS
      # ==========================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          mkdir -p \
            "$DEPS/src" \
            "$DEPS/lib" \
            "$DEPS/build-epanet" \
            "$DEPS/build-msx" \
            "$DEPS/build-shapelib" \
            "$DEPS/build-proj" \
            "$DEPS/proj-install" \
            bin/mac \
            dist \
            diagnostics

      # ==========================================
      # 8. COMPILAR EPANET
      # ==========================================

      - name: Build EPANET
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OpenWaterAnalytics/EPANET.git \
            "$DEPS/src/epanet"

          cmake \
            -S "$DEPS/src/epanet" \
            -B "$DEPS/build-epanet" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF

          cmake --build "$DEPS/build-epanet" \
            --config Release \
            --parallel 3

          find "$DEPS/build-epanet" \
            -type f -name 'libepanet*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;

          EPANET_DYLIB="$(find "$DEPS/lib" \
            -name 'libepanet*.dylib' -print -quit)"

          if [[ -z "$EPANET_DYLIB" ]]; then
            echo "::error::No se generó libepanet."
            exit 1
          fi

          file "$EPANET_DYLIB"
          lipo -archs "$EPANET_DYLIB" | grep -q arm64

          echo "EPANET_DYLIB=$EPANET_DYLIB" >> "$GITHUB_ENV"

      # ==========================================
      # 9. DESCARGAR EPANET-MSX
      # ==========================================

      - name: Download EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"
          MSX_SOURCE="$DEPS/src/epanetmsx"

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/USEPA/EPANETMSX.git \
            "$MSX_SOURCE"

          if [[ ! -f "$MSX_SOURCE/EPANET2.2/SRC_engines/CMakeLists.txt" ]]; then
            echo "::error::No se encontró SRC_engines/CMakeLists.txt."
            git -C "$MSX_SOURCE" submodule status
            find "$MSX_SOURCE" -maxdepth 5 -type f -name CMakeLists.txt
            exit 1
          fi

      # ==========================================
      # 10. COMPILAR EPANET-MSX
      # ==========================================

      - name: Build EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cmake \
            -S "$DEPS/src/epanetmsx" \
            -B "$DEPS/build-msx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib" \
            -DEPANET_LIB="$EPANET_DYLIB"

          cmake --build "$DEPS/build-msx" \
            --config Release \
            --parallel 3

          MSX_DYLIB="$(find "$DEPS/build-msx" \
            -type f -name 'libepanetmsx*.dylib' \
            -print -quit)"

          if [[ -z "$MSX_DYLIB" ]]; then
            echo "::error::No se generó libepanetmsx.dylib."
            find "$DEPS/build-msx" -type f -print
            exit 1
          fi

          cp -v "$MSX_DYLIB" "$DEPS/lib/"

          file "$DEPS/lib/$(basename "$MSX_DYLIB")"
          lipo -archs "$DEPS/lib/$(basename "$MSX_DYLIB")" \
            | grep -q arm64

      # ==========================================
      # 11. COMPILAR SHAPELIB
      # ==========================================

      - name: Build ShapeLib
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OSGeo/shapelib.git \
            "$DEPS/src/shapelib"

          cmake \
            -S "$DEPS/src/shapelib" \
            -B "$DEPS/build-shapelib" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON

          cmake --build "$DEPS/build-shapelib" \
            --config Release \
            --parallel 3

          SHP_DYLIB="$(find "$DEPS/build-shapelib" \
            -type f -name 'libshp*.dylib' \
            -print -quit)"

          if [[ -z "$SHP_DYLIB" ]]; then
            echo "::error::No se generó libshp.dylib."
            exit 1
          fi

          cp -v "$SHP_DYLIB" "$DEPS/lib/"

          file "$DEPS/lib/$(basename "$SHP_DYLIB")"
          lipo -archs "$DEPS/lib/$(basename "$SHP_DYLIB")" \
            | grep -q arm64

      # ==========================================
      # 12. COMPILAR PROJ 7.2.1
      # ==========================================

      - name: Build PROJ 7.2.1 ARM64
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          PROJ_SOURCE="$DEPS/src/proj-$PROJ_VERSION"
          PROJ_BUILD="$DEPS/build-proj"
          PROJ_INSTALL="$DEPS/proj-install"

          PROJ_DB="$PROJ_BUILD/data/proj.db"
          PROJ_LOG="$RUNNER_TEMP/proj-db-build.log"
          PROJ_BUILD_LOG="$RUNNER_TEMP/proj-library-build.log"

          mkdir -p diagnostics

          echo "========================================"
          echo "VERIFICAR SQLITE"
          echo "========================================"

          command -v sqlite3
          sqlite3 --version

          sqlite3 :memory: \
            "CREATE TABLE test(id INTEGER); INSERT INTO test VALUES(1); SELECT * FROM test;"

          echo "========================================"
          echo "DESCARGAR PROJ $PROJ_VERSION"
          echo "========================================"

          curl --fail --location --retry 4 \
            "https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz"

          tar -xzf "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz" \
            -C "$DEPS/src"

          test -f "$PROJ_SOURCE/CMakeLists.txt"
          test -f "$PROJ_SOURCE/data/CMakeLists.txt"

          echo "========================================"
          echo "CONFIGURAR PROJ"
          echo "========================================"

          cmake \
            -S "$PROJ_SOURCE" \
            -B "$PROJ_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$PROJ_INSTALL" \
            -DCMAKE_PREFIX_PATH="$SQLITE_PREFIX" \
            -DSQLITE3_INCLUDE_DIR="$SQLITE_PREFIX/include" \
            -DSQLITE3_LIBRARY="$SQLITE_PREFIX/lib/libsqlite3.dylib" \
            -DENABLE_TIFF=OFF \
            -DENABLE_CURL=OFF \
            -DBUILD_PROJSYNC=OFF \
            -DBUILD_CCT=OFF \
            -DBUILD_CS2CS=OFF \
            -DBUILD_GEOD=OFF \
            -DBUILD_GIE=OFF \
            -DBUILD_PROJ=OFF \
            -DBUILD_PROJINFO=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_VERBOSE_MAKEFILE=ON

          echo "========================================"
          echo "VERIFICAR OPCIONES DE CMAKE"
          echo "========================================"

          grep -E \
            'PROJ_VERSION|ENABLE_CURL|BUILD_PROJSYNC|BUILD_SHARED_LIBS|SQLITE3' \
            "$PROJ_BUILD/CMakeCache.txt" || true

          echo "========================================"
          echo "GENERAR PROJ.DB"
          echo "========================================"

          cmake --build "$PROJ_BUILD" \
            --target generate_proj_db \
            --verbose \
            > "$PROJ_LOG" 2>&1 &

          BUILD_PID=$!

          while kill -0 "$BUILD_PID" 2>/dev/null; do

            echo "PROJ sigue trabajando: $(date)"

            if [[ -f "$PROJ_BUILD/data/all.sql.in" ]]; then
              ls -lh "$PROJ_BUILD/data/all.sql.in"
            else
              echo "Esperando all.sql.in..."
            fi

            if [[ -f "$PROJ_DB" ]]; then
              ls -lh "$PROJ_DB"
            else
              echo "Esperando proj.db..."
            fi

            tail -n 8 "$PROJ_LOG" || true

            sleep 60
          done

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          set -e

          cat "$PROJ_LOG"

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo "::error::Falló la generación de proj.db."
            exit "$BUILD_STATUS"
          fi

          echo "========================================"
          echo "VERIFICAR PROJ.DB"
          echo "========================================"

          if [[ ! -f "$PROJ_DB" ]]; then
            echo "::error::No se generó proj.db."
            exit 1
          fi

          ls -lh "$PROJ_DB"

          DB_CHECK="$(sqlite3 "$PROJ_DB" \
            "PRAGMA integrity_check;")"

          echo "Resultado: $DB_CHECK"

          if [[ "$DB_CHECK" != "ok" ]]; then
            echo "::error::La base de datos PROJ no es válida."
            exit 1
          fi

          TABLE_COUNT="$(sqlite3 "$PROJ_DB" \
            "SELECT count(*) FROM sqlite_master WHERE type='table';")"

          echo "Número de tablas: $TABLE_COUNT"

          if [[ "$TABLE_COUNT" -lt 1 ]]; then
            echo "::error::La base de datos no contiene tablas."
            exit 1
          fi

          echo "========================================"
          echo "COMPILAR BIBLIOTECA PROJ"
          echo "========================================"

          cmake --build "$PROJ_BUILD" \
            --config Release \
            --parallel 3 \
            --verbose \
            > "$PROJ_BUILD_LOG" 2>&1 &

          BUILD_PID=$!

          while kill -0 "$BUILD_PID" 2>/dev/null; do
            echo "PROJ compilando biblioteca: $(date)"
            tail -n 8 "$PROJ_BUILD_LOG" || true
            sleep 60
          done

          set +e
          wait "$BUILD_PID"
          BUILD_STATUS=$?
          set -e

          cat "$PROJ_BUILD_LOG"

          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            echo "::error::Falló la compilación de PROJ."
            exit "$BUILD_STATUS"
          fi

          echo "========================================"
          echo "INSTALAR PROJ"
          echo "========================================"

          cmake --install "$PROJ_BUILD" \
            --config Release

          echo "========================================"
          echo "LOCALIZAR LIBPROJ"
          echo "========================================"

          PROJ_DYLIB="$(find "$PROJ_INSTALL/lib" \
            -type f -name 'libproj*.dylib' \
            -print -quit)"

          if [[ -z "$PROJ_DYLIB" ]]; then
            echo "::error::No se encontró libproj.dylib."
            find "$PROJ_INSTALL" -type f -print
            exit 1
          fi

          echo "Biblioteca encontrada: $PROJ_DYLIB"

          echo "========================================"
          echo "VERIFICAR SIMBOLOS PROJ"
          echo "========================================"

          nm -gU "$PROJ_DYLIB" \
            > "$RUNNER_TEMP/proj-symbols.txt"

          for SYMBOL in \
            _pj_init_plus \
            _pj_transform \
            _pj_is_latlong \
            _pj_free; do

            if ! grep -q "$SYMBOL" \
              "$RUNNER_TEMP/proj-symbols.txt"; then

              echo "::error::Falta el símbolo PROJ: $SYMBOL"

              cat "$RUNNER_TEMP/proj-symbols.txt"

              exit 1
            fi

            echo "Encontrado: $SYMBOL"
          done

          echo "========================================"
          echo "VERIFICAR ARQUITECTURA"
          echo "========================================"

          file "$PROJ_DYLIB"

          lipo -archs "$PROJ_DYLIB" | grep -q arm64

          cp -L "$PROJ_DYLIB" "$DEPS/lib/libproj.dylib"
          cp "$PROJ_DB" "$DEPS/lib/proj.db"

          echo "PROJ_INSTALL=$PROJ_INSTALL" >> "$GITHUB_ENV"

          echo "PROJ 7.2.1 FINALIZADO CORRECTAMENTE."

      # ==========================================
      # 13. PREPARAR BIBLIOTECAS NATIVAS
      # ==========================================

      - name: Prepare native libraries
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cp -Lv "$LIBOMP_PREFIX/lib/libomp.dylib" \
            "$DEPS/lib/libomp.dylib"

          cp -Lv "$DEPS/lib/"*.dylib bin/mac/

          echo "=== Bibliotecas ==="

          ls -lah bin/mac

          echo "=== Verificar ARM64 ==="

          for LIBRARY in bin/mac/*.dylib; do

            echo "Verificando: $LIBRARY"

            file "$LIBRARY"

            lipo -archs "$LIBRARY" | grep -q arm64 || {
              echo "::error::Biblioteca incompatible: $LIBRARY"
              exit 1
            }
          done

      # ==========================================
      # 14. COMPILAR EPANET-UI
      # ==========================================

      - name: Build EPANET-UI project
        shell: bash
        run: |
          set -euxo pipefail

          test -f epanet_ui_mac.lpi
          test -f epanet_ui_mac.lpr

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --pcp="$HOME/.lazarus" \
            --compiler="$FPC_BIN" \
            --build-all \
            --ws=cocoa \
            epanet_ui_mac.lpi

          echo "=== Archivos generados ==="

          find . -maxdepth 8 \
            \( -name '*.app' -o \
               -name 'epanet-ui*' -o \
               -name '*.dylib' \) \
            -print | sort

      # ==========================================
      # 15. VERIFICAR APLICACION
      # ==========================================

      - name: Verify application
        shell: bash
        run: |
          set -euxo pipefail

          APP="$(find . -type d \
            -name '*.app' \
            -not -path './.git/*' \
            -print -quit)"

          if [[ -z "$APP" ]]; then
            echo "::error::No se encontró el bundle .app."
            find . -maxdepth 8 -type f -perm -111 -print
            exit 1
          fi

          INFO_PLIST="$APP/Contents/Info.plist"

          if [[ ! -f "$INFO_PLIST" ]]; then
            echo "::error::Falta Info.plist."
            exit 1
          fi

          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$INFO_PLIST")"

          EXECUTABLE="$APP/Contents/MacOS/$APP_EXECUTABLE"

          if [[ ! -f "$EXECUTABLE" ]]; then
            echo "::error::No existe el ejecutable principal."
            exit 1
          fi

          file "$EXECUTABLE"

          lipo -archs "$EXECUTABLE" | grep -q arm64

          echo "=== Dependencias dinámicas ==="

          otool -L "$EXECUTABLE"

          echo "=== Bundle ==="

          find "$APP" -maxdepth 5 -print

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # ==========================================
      # 16. EMPAQUETAR APLICACION
      # ==========================================

      - name: Package macOS application
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip"

          shasum -a 256 \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip" \
            > "dist/SHA256SUMS.txt"

          ls -lah dist

      # ==========================================
      # 17. SUBIR DIAGNOSTICOS
      # ==========================================

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64-diagnostics
          path: |
            ${{ runner.temp }}/native-deps/
            ${{ runner.temp }}/proj-db-build.log
            ${{ runner.temp }}/proj-library-build.log
            ${{ runner.temp }}/proj-symbols.txt
            ${{ runner.temp }}/lazarus-components/
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # 18. SUBIR APLICACION FINAL
      # ==========================================

      - name: Upload macOS application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-ui-macos-arm64
          path: |
            dist/EPANET-UI-macOS-Apple-Silicon.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
