
name: Build EPANET-UI macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/build-macos.yml"
      - "epanet_ui_mac.lpi"
      - "epanet_ui_mac.lpr"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: epanet-ui-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 240

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LAZARUS_VERSION: "4.8"
      LAZARUS_ZIP: "lazarus-darwin-aarch64-4.8.zip"
      FPC_DMG: "fpc-3.2.4rc1a.intelarm64-macosx.dmg"
      PROJ_VERSION: "7.2.1"

    steps:

      # 1. CHECKOUT

      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. SELECCIONAR XCODE 16.2

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euxo pipefail

          XCODE_APP="/Applications/Xcode_16.2.app"

          if [[ ! -d "$XCODE_APP" ]]; then
            echo "::error::Xcode 16.2 no está instalado."
            ls -lah /Applications/Xcode*
            exit 1
          fi

          sudo xcode-select --switch \
            "$XCODE_APP/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" \
            >> "$GITHUB_ENV"

          xcode-select -p
          xcodebuild -version
          xcrun --find ld
          ld -v

      # 3. VERIFICAR ARQUITECTURA

      - name: Verify Apple Silicon
        shell: bash
        run: |
          set -euxo pipefail

          sw_vers
          test "$(uname -m)" = "arm64"

          clang --version
          git --version
          xcodebuild -version

      # 4. DEPENDENCIAS

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew install cmake libomp pkg-config sqlite

          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" \
            >> "$GITHUB_ENV"

          echo "SQLITE_PREFIX=$(brew --prefix sqlite)" \
            >> "$GITHUB_ENV"

          cmake --version

          test -f "$(brew --prefix sqlite)/include/sqlite3.h"
          test -f "$(brew --prefix libomp)/lib/libomp.dylib"

      # 5. FREE PASCAL

      - name: Install Free Pascal ARM64
        shell: bash
        run: |
          set -euxo pipefail

          FPC_URL="https://downloads.freepascal.org/fpc/beta/3.2.4-rc1/aarch64-macosx/${FPC_DMG}"

          DMG_PATH="$RUNNER_TEMP/$FPC_DMG"
          MOUNT_POINT="$RUNNER_TEMP/fpc-mount"

          mkdir -p "$MOUNT_POINT"

          curl --fail --location --retry 4 \
            "$FPC_URL" \
            --output "$DMG_PATH"

          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT_POINT" \
            "$DMG_PATH"

          FPC_PKG="$(find "$MOUNT_POINT" \
            -type f -name '*.pkg' -print -quit)"

          if [[ -z "$FPC_PKG" ]]; then
            echo "::error::No se encontró el paquete FPC."
            find "$MOUNT_POINT" -maxdepth 4 -print
            exit 1
          fi

          sudo installer -pkg "$FPC_PKG" -target /

          hdiutil detach "$MOUNT_POINT"

          FPC_BIN="$(command -v fpc || true)"

          if [[ -z "$FPC_BIN" ]]; then
            echo "::error::No se encontró FPC."
            exit 1
          fi

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"

          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP

          test "$("$FPC_BIN" -iTP)" = "aarch64"

      # 6. LAZARUS

      - name: Install Lazarus
        shell: bash
        run: |
          set -euxo pipefail

          DOWNLOAD_URL="https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/${LAZARUS_ZIP}"

          INSTALL_DIR="$RUNNER_TEMP/lazarus-${LAZARUS_VERSION}"

          mkdir -p "$INSTALL_DIR"

          curl --fail --location --retry 4 \
            "$DOWNLOAD_URL" \
            --output "$RUNNER_TEMP/$LAZARUS_ZIP"

          unzip -q "$RUNNER_TEMP/$LAZARUS_ZIP" \
            -d "$INSTALL_DIR"

          LAZBUILD_PATH="$(find "$INSTALL_DIR" \
            -type f -name lazbuild -perm -111 \
            -print -quit)"

          if [[ -z "$LAZBUILD_PATH" ]]; then
            echo "::error::No se encontró lazbuild."
            find "$INSTALL_DIR" -maxdepth 6 -print
            exit 1
          fi

          LAZARUS_DIR="$(dirname "$LAZBUILD_PATH")"

          test -f "$LAZARUS_DIR/packager/registration/fcl.lpk"

          echo "LAZARUS_DIR=$LAZARUS_DIR" >> "$GITHUB_ENV"
          echo "LAZBUILD_PATH=$LAZBUILD_PATH" >> "$GITHUB_ENV"

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --version

      # 7. PAQUETES LAZARUS

      - name: Install Lazarus packages
        shell: bash
        run: |
          set -euxo pipefail

          COMPONENTS="$RUNNER_TEMP/lazarus-components"
          LAZARUS_CONFIG="$HOME/.lazarus"

          mkdir -p "$COMPONENTS" "$LAZARUS_CONFIG"

          git clone --depth 1 --branch v11.6.6 \
            https://github.com/bgrabitmap/bgrabitmap.git \
            "$COMPONENTS/BGRA"

          git clone --depth 1 --branch 11.10 \
            https://github.com/BerndGabriel/HtmlViewer.git \
            "$COMPONENTS/HtmlViewer"

          git clone --depth 1 \
            https://github.com/andreaspeters/LazMapViewer.git \
            "$COMPONENTS/LazMapViewer"

          BGRA_BITMAP_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bgrabitmappack.lpk' -print -quit)"

          BGRA_CONTROLS_LPK="$(find "$COMPONENTS/BGRA" \
            -iname 'bglcontrols.lpk' -print -quit)"

          HTML_LPK="$(find "$COMPONENTS/HtmlViewer" \
            -iname '*frameviewer*.lpk' -print -quit)"

          MAP_LPK="$(find "$COMPONENTS/LazMapViewer" \
            -iname '*lazmapviewerpkg*.lpk' -print -quit)"

          for PACKAGE in \
            "$BGRA_BITMAP_LPK" \
            "$BGRA_CONTROLS_LPK" \
            "$HTML_LPK" \
            "$MAP_LPK"; do

            if [[ -z "$PACKAGE" || ! -f "$PACKAGE" ]]; then
              echo "::error::No se encontró un paquete Lazarus."
              find "$COMPONENTS" -name '*.lpk' -print
              exit 1
            fi
          done

          LAZBUILD_ARGS=(
            "--lazarusdir=$LAZARUS_DIR"
            "--pcp=$LAZARUS_CONFIG"
            "--compiler=$FPC_BIN"
          )

          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$BGRA_BITMAP_LPK"
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$BGRA_CONTROLS_LPK"
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$HTML_LPK"
          "$LAZBUILD_PATH" "${LAZBUILD_ARGS[@]}" "$MAP_LPK"

      # 8. DIRECTORIOS

      - name: Prepare build directories
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          mkdir -p \
            "$DEPS/src" \
            "$DEPS/lib" \
            "$DEPS/build-epanet" \
            "$DEPS/build-msx" \
            "$DEPS/build-shapelib" \
            "$DEPS/build-proj" \
            "$DEPS/proj-install" \
            bin/mac \
            dist

      # 9. COMPILAR EPANET

      - name: Build EPANET
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OpenWaterAnalytics/EPANET.git \
            "$DEPS/src/epanet"

          cmake \
            -S "$DEPS/src/epanet" \
            -B "$DEPS/build-epanet" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF

          cmake --build "$DEPS/build-epanet" \
            --config Release \
            --parallel 3

          find "$DEPS/build-epanet" \
            -type f -name 'libepanet*.dylib' \
            -exec cp -v {} "$DEPS/lib/" \;

          EPANET_DYLIB="$(find "$DEPS/lib" \
            -name 'libepanet*.dylib' -print -quit)"

          test -n "$EPANET_DYLIB"

          file "$EPANET_DYLIB"
          lipo -archs "$EPANET_DYLIB" | grep -q arm64

      # 10. DESCARGAR EPANET-MSX

      - name: Download EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/USEPA/EPANETMSX.git \
            "$DEPS/src/epanetmsx"

          test -f "$DEPS/src/epanetmsx/EPANET2.2/SRC_engines/CMakeLists.txt"

      # 11. COMPILAR EPANET-MSX

      - name: Build EPANET-MSX
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cmake \
            -S "$DEPS/src/epanetmsx" \
            -B "$DEPS/build-msx" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib"

          cmake --build "$DEPS/build-msx" \
            --config Release \
            --parallel 3

          MSX_DYLIB="$(find "$DEPS/build-msx" \
            -type f -name 'libepanetmsx*.dylib' \
            -print -quit)"

          if [[ -z "$MSX_DYLIB" ]]; then
            echo "::error::No se generó libepanetmsx."
            find "$DEPS/build-msx" -type f -print
            exit 1
          fi

          cp -L "$MSX_DYLIB" "$DEPS/lib/"

          lipo -archs "$DEPS/lib/$(basename "$MSX_DYLIB")" \
            | grep -q arm64

      # 12. COMPILAR SHAPELIB

      - name: Build ShapeLib
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          git clone --depth 1 \
            https://github.com/OSGeo/shapelib.git \
            "$DEPS/src/shapelib"

          cmake \
            -S "$DEPS/src/shapelib" \
            -B "$DEPS/build-shapelib" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON

          cmake --build "$DEPS/build-shapelib" \
            --config Release \
            --parallel 3

          SHP_DYLIB="$(find "$DEPS/build-shapelib" \
            \( -type f -o -type l \) \
            -name 'libshp*.dylib' \
            -print -quit)"

          if [[ -z "$SHP_DYLIB" ]]; then
            echo "::error::No se encontró libshp."
            find "$DEPS/build-shapelib" -type f -print
            exit 1
          fi

          cp -L "$SHP_DYLIB" "$DEPS/lib/libshp.dylib"
          cp -L "$SHP_DYLIB" bin/mac/libshp.dylib

          file bin/mac/libshp.dylib
          lipo -archs bin/mac/libshp.dylib | grep -q arm64

      # 13. COMPILAR PROJ

      - name: Build PROJ 7.2.1 ARM64
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          PROJ_SOURCE="$DEPS/src/proj-$PROJ_VERSION"
          PROJ_BUILD="$DEPS/build-proj"
          PROJ_INSTALL="$DEPS/proj-install"

          curl --fail --location --retry 4 \
            "https://download.osgeo.org/proj/proj-${PROJ_VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz"

          tar -xzf "$RUNNER_TEMP/proj-${PROJ_VERSION}.tar.gz" \
            -C "$DEPS/src"

          cmake \
            -S "$PROJ_SOURCE" \
            -B "$PROJ_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$PROJ_INSTALL" \
            -DCMAKE_PREFIX_PATH="$SQLITE_PREFIX" \
            -DSQLITE3_INCLUDE_DIR="$SQLITE_PREFIX/include" \
            -DSQLITE3_LIBRARY="$SQLITE_PREFIX/lib/libsqlite3.dylib" \
            -DENABLE_TIFF=OFF \
            -DENABLE_CURL=OFF \
            -DBUILD_PROJSYNC=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=ON

          cmake --build "$PROJ_BUILD" \
            --config Release \
            --parallel 3

          cmake --install "$PROJ_BUILD" \
            --config Release

          PROJ_DYLIB="$(find "$PROJ_INSTALL/lib" \
            -type f -name 'libproj*.dylib' \
            -print -quit)"

          if [[ -z "$PROJ_DYLIB" ]]; then
            echo "::error::No se generó libproj."
            find "$PROJ_INSTALL" -type f -print
            exit 1
          fi

          cp -L "$PROJ_DYLIB" "$DEPS/lib/libproj.dylib"

          PROJ_DB="$(find "$PROJ_SOURCE" \
            -name proj.db -print -quit)"

          if [[ -z "$PROJ_DB" ]]; then
            echo "::error::No se encontró proj.db."
            exit 1
          fi

          cp "$PROJ_DB" "$DEPS/lib/proj.db"

          file "$DEPS/lib/libproj.dylib"
          lipo -archs "$DEPS/lib/libproj.dylib" | grep -q arm64

      # 14. PREPARAR BIBLIOTECAS

      - name: Prepare native libraries
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$RUNNER_TEMP/native-deps"

          cp -Lv "$LIBOMP_PREFIX/lib/libomp.dylib" \
            "$DEPS/lib/libomp.dylib"

          cp -Lv "$DEPS/lib/"*.dylib bin/mac/

          for LIB in \
            libshp.dylib \
            libproj.dylib \
            libomp.dylib; do

            test -f "bin/mac/$LIB"
            file "bin/mac/$LIB"
            lipo -archs "bin/mac/$LIB" | grep -q arm64
          done

          ls -lah bin/mac

      # 15. COMPILAR EPANET-UI
      # IMPORTANTE: no forzar -Xe.

      - name: Build EPANET-UI project
        shell: bash
        run: |
          set -euxo pipefail

          test -f epanet_ui_mac.lpi
          test -f epanet_ui_mac.lpr

          echo "=== XCODE ==="
          xcodebuild -version

          echo "=== LINKER ==="
          xcrun --find ld
          ld -v

          echo "=== FPC ==="
          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP

          echo "=== BIBLIOTECAS ==="

          for LIB in \
            libshp.dylib \
            libproj.dylib \
            libomp.dylib; do
            test -f "bin/mac/$LIB"
          done

          echo "=== COMPILACIÓN LAZARUS ==="

          "$LAZBUILD_PATH" \
            --lazarusdir="$LAZARUS_DIR" \
            --pcp="$HOME/.lazarus" \
            --compiler="$FPC_BIN" \
            --build-all \
            --ws=cocoa \
            epanet_ui_mac.lpi

          echo "=== VERIFICAR EJECUTABLE ==="

          test -f bin/mac/epanet-ui

          file bin/mac/epanet-ui
          lipo -archs bin/mac/epanet-ui | grep -q arm64

      # 16. EMPAQUETAR APLICACIÓN

      - name: Package macOS application
        shell: bash
        run: |
          set -euxo pipefail

          APP="bin/mac/epanet-ui.app"
          EXECUTABLE="bin/mac/epanet-ui"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/Resources"

          cp "$EXECUTABLE" "$APP/Contents/MacOS/epanet-ui"

          cp -Lv bin/mac/*.dylib \
            "$APP/Contents/Frameworks/"

          cp "$RUNNER_TEMP/native-deps/lib/proj.db" \
            "$APP/Contents/Resources/proj.db"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>EPANET-UI</string>
              <key>CFBundleDisplayName</key>
              <string>EPANET-UI</string>
              <key>CFBundleIdentifier</key>
              <string>org.openwateranalytics.epanetui</string>
              <key>CFBundleExecutable</key>
              <string>epanet-ui</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          for LIB in "$APP"/Contents/Frameworks/*.dylib; do
            install_name_tool \
              -id "@rpath/$(basename "$LIB")" \
              "$LIB"
          done

          install_name_tool \
            -add_rpath "@executable_path/../Frameworks" \
            "$APP/Contents/MacOS/epanet-ui"

          find "$APP/Contents/Frameworks" \
            -name '*.dylib' -print0 |
            while IFS= read -r -d '' LIB; do
              codesign --force --sign - "$LIB"
            done

          codesign --force --deep --sign - "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # 17. VERIFICAR APLICACIÓN

      - name: Verify application
        shell: bash
        run: |
          set -euxo pipefail

          APP="$APP_PATH"
          EXECUTABLE="$APP/Contents/MacOS/epanet-ui"

          test -f "$EXECUTABLE"
          test -f "$APP/Contents/Info.plist"

          file "$EXECUTABLE"
          lipo -archs "$EXECUTABLE" | grep -q arm64

          echo "=== DEPENDENCIAS ==="
          otool -L "$EXECUTABLE"

          echo "=== RUTAS ==="
          otool -l "$EXECUTABLE" | grep -A2 LC_RPATH

          echo "=== FIRMA ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

      # 18. COMPRIMIR

      - name: Create distribution ZIP
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip"

          shasum -a 256 \
            "dist/EPANET-UI-macOS-Apple-Silicon.zip" \
            > "dist/SHA256SUMS.txt"

          ls -lah dist

      # 19. SUBIR DIAGNÓSTICOS

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epanet-ui-macos-arm64-diagnostics
          path: |
            ${{ runner.temp }}/native-deps/
            ${{ runner.temp }}/lazarus-components/
          if-no-files-found: ignore
          retention-days: 7

      # 20. SUBIR APLICACIÓN FINAL

      - name: Upload macOS application
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: epanet-ui-macos-arm64
          path: |
            dist/EPANET-UI-macOS-Apple-Silicon.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
